# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The checked-in TreadingWater.xcodeproj should open directly in Xcode 16+.
# If it ever gets out of step, `brew install xcodegen && xcodegen generate`
# regenerates an equivalent project from this file.

name: TreadingWater
options:
  bundleIdPrefix: com.treadingwater
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TreadingWater:
    type: application
    platform: iOS
    sources:
      - TreadingWater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treadingwater.app
        PRODUCT_NAME: TreadingWater
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Treading Water
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
